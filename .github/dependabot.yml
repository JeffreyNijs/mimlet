version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      development-dependencies:
        dependency-type: development
        # Major updates arrive as separate pull requests, so one breaking release cannot
        # block every other update in the group.
        update-types:
          - minor
          - patch
        patterns:
          - '*'
    # The adapters' native libraries are pinned on purpose (root, packages/* and apps/docs
    # devDependencies) to versions listed in tests/vendor-versions.json, mostly the tested
    # minimum; scripts/check-workspace.mjs rejects an untested pin in an adapter package.
    # New releases enter that matrix by review, and the weekly native canary workflow
    # tests the latest release of each library.
    ignore:
      - dependency-name: zod
      - dependency-name: arktype
      - dependency-name: '@faker-js/faker'
      - dependency-name: effect
      - dependency-name: valibot
      - dependency-name: typebox
      - dependency-name: '@sinclair/typebox'
      - dependency-name: fast-check
      - dependency-name: class-validator
      - dependency-name: class-transformer
      # The workspace builds and generates with TypeScript 6: tsup's declaration build and
      # @hey-api/openapi-ts load TypeScript's compiler API at runtime, which TypeScript 7 no
      # longer ships. Revisit when both support TypeScript 7. Consumers on TypeScript 7 are
      # tested by the "TypeScript 7.0.2 / packed consumers" job in runtime-compatibility.yml.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Node type definitions follow the oldest supported Node major (engines: >=22.18), so
      # newer majors cannot hide use of APIs that Node 22 lacks.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - '*'
    open-pull-requests-limit: 5
