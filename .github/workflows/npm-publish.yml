name: Publish verified toolkit artifacts

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: toolkit-publication
  cancel-in-progress: false

jobs:
  portable:
    uses: ./.github/workflows/runtime-compatibility.yml
    permissions:
      contents: read

  prepare:
    if: startsWith(github.event.release.tag_name, 'toolkit-v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: pnpm
      - name: Require the reviewed release commit to belong to main
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm audit:production
      - run: pnpm test:examples
      - run: node scripts/test-browser.mjs --install
      - name: Retain browser diagnostics, including failed startup
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-browser-diagnostics
          path: test-results/browser/
          retention-days: 7
          if-no-files-found: warn
      - run: pnpm release:prepare
      - name: Verify tag and prerelease channel
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { validateReleaseManifest } from './scripts/release-manifest.mjs';
          const manifest = validateReleaseManifest(JSON.parse(readFileSync('release/manifest.json')), process.env.RELEASE_TAG);
          if (manifest.prerelease !== (process.env.PRERELEASE === 'true')) throw new Error('Release channel mismatch');
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: verified-toolkit-release
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [prepare, portable]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: release
          digest-mismatch: error
      - name: Verify all artifacts, then publish without product lifecycle scripts
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, readdirSync, lstatSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { resolve } from 'node:path';
          const raw = readFileSync('release/manifest.json');
          if (raw.length > 128000) throw new Error('Oversized manifest');
          const m = JSON.parse(raw);
          const version = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
          if (m.format !== 2 || !/^[a-f0-9]{40}$/.test(m.commit) || !version.test(m.coreVersion) || m.tag !== `toolkit-v${m.coreVersion}` || m.tag !== process.env.RELEASE_TAG) throw new Error('Invalid release identity');
          const prerelease = m.coreVersion.includes('-');
          if (m.prerelease !== prerelease || prerelease !== (process.env.PRERELEASE === 'true')) throw new Error('Release channel mismatch');
          // BEGIN CANONICAL DIST-TAG POLICY
          function releaseDistTag(name, version) {
            if (typeof name !== 'string' || typeof version !== 'string')
              throw new Error('Invalid package identity for the distribution tag');
            return name === 'hey-api-builders' && version.includes('-') ? 'next' : 'latest';
          }
          // END CANONICAL DIST-TAG POLICY
          if (!Array.isArray(m.packages) || m.packages.length < 2 || m.packages.length > 64) throw new Error('Invalid inventory');
          const metadataSet = [];
          const seen = new Set(), files = new Set(['manifest.json', 'SHA256SUMS']);
          const digest = (data, algorithm, encoding) => createHash(algorithm).update(data).digest(encoding);
          const registry = async (pkg) => {
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/${pkg.version}`, { signal: AbortSignal.timeout(30000) });
            if (response.status === 404) return null;
            if (!response.ok) throw new Error(`Registry lookup failed: ${response.status}`);
            return response.json();
          };
          for (const p of m.packages) {
            if (!/^(hey-api-builders|@mimlet\/[a-z0-9]+(?:-[a-z0-9]+)*)$/.test(p.name) || !version.test(p.version) || seen.has(p.name)) throw new Error('Invalid package identity');
            if (p.filename !== `${p.name.replace('@', '').replace('/', '-')}-${p.version}.tgz` || files.has(p.filename)) throw new Error('Invalid artifact filename');
            if (p.name !== 'hey-api-builders' && p.version !== m.coreVersion) throw new Error('Version train mismatch');
            if (p.version.includes('-') !== prerelease) throw new Error('Mixed release channels');
            if (p.distTag !== releaseDistTag(p.name, p.version)) throw new Error(`Distribution tag policy mismatch: ${p.name}`);
            const path = resolve('release', p.filename), stat = lstatSync(path);
            if (!stat.isFile() || stat.isSymbolicLink() || stat.size > 64 * 1024 * 1024) throw new Error('Invalid artifact type or size');
            const data = readFileSync(path);
            if (digest(data, 'sha256', 'hex') !== p.sha256 || `sha512-${digest(data, 'sha512', 'base64')}` !== p.integrity) throw new Error('Artifact digest mismatch');
            const metadata = JSON.parse(execFileSync('tar', ['-xOf', path, 'package/package.json'], { encoding: 'utf8', maxBuffer: 1000000, timeout: 10000 }));
            if (metadata.name !== p.name || metadata.version !== p.version || metadata.private !== false) throw new Error('Package metadata mismatch');
            metadataSet.push(metadata);
            seen.add(p.name); files.add(p.filename);
          }
          if (m.packages[0].name !== '@mimlet/core' || !seen.has('hey-api-builders')) throw new Error('Missing core or integration');
          if (readdirSync('release').some((file) => !files.has(file))) throw new Error('Unexpected artifact file');
          // BEGIN CANONICAL METADATA GUARD
          function validateReleasePackageMetadata(manifest, metadata) {
            const fail = (message) => {
              throw new Error(`Release metadata: ${message}`);
            };
            if (
              !manifest ||
              !Array.isArray(manifest.packages) ||
              !Array.isArray(metadata) ||
              metadata.length !== manifest.packages.length
            )
              fail('incomplete package inventory');
            const entries = new Map(manifest.packages.map((entry) => [entry.name, entry]));
            const seen = new Set();
            for (const pkg of metadata) {
              const expected = entries.get(pkg?.name);
              if (
                !expected ||
                seen.has(pkg.name) ||
                pkg.version !== expected.version ||
                pkg.private !== false
              )
                fail('packed package identity differs from the verified manifest');
              if (
                expected.distTag !== releaseDistTag(pkg.name, pkg.version) ||
                pkg.publishConfig?.tag !== expected.distTag
              )
                fail(`packed distribution tag differs from the verified manifest: ${pkg.name}`);
              seen.add(pkg.name);
              for (const group of ['dependencies', 'peerDependencies', 'optionalDependencies']) {
                const dependencies = pkg[group] ?? {};
                if (typeof dependencies !== 'object' || dependencies === null || Array.isArray(dependencies))
                  fail('invalid dependency metadata');
                for (const [name, version] of Object.entries(dependencies)) {
                  if (typeof version !== 'string') fail('dependency versions must be strings');
                  const internal =
                    name === 'hey-api-builders' ||
                    name === 'mimlet' ||
                    /^@mimlet\/[a-z0-9]+(?:-[a-z0-9]+)*$/.test(name);
                  if (internal && (!entries.has(name) || entries.get(name).version !== version))
                    fail(`missing or mismatched internal dependency: ${name}`);
                }
              }
            }
            if (seen.size !== entries.size) fail('missing or duplicate package metadata');
            return metadata;
          }
          // END CANONICAL METADATA GUARD
          validateReleasePackageMetadata(m, metadataSet);
          const pending = [];
          // Fail closed on registry errors or conflicting published bytes before publishing anything.
          for (const p of m.packages) {
            const current = await registry(p);
            if (current === null) pending.push(p);
            else if (current.dist?.integrity !== p.integrity) throw new Error(`Published content differs: ${p.name}@${p.version}`);
            else console.log(`Already published with matching integrity: ${p.name}@${p.version}`);
          }
          // Each package keeps its own verified tag: `latest`, or `next` for hey-api-builders prereleases.
          for (const p of pending) {
            execFileSync('npm', ['publish', resolve('release', p.filename), '--access', 'public', '--ignore-scripts', '--tag', p.distTag, '--provenance'], { stdio: 'inherit', timeout: 120000 });
          }
          JS
