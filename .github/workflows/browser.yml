name: Browser acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      project:
        description: Browser to diagnose (all runs normal acceptance)
        type: choice
        options: [all, chromium, firefox, webkit]
        default: all
      repeat:
        description: Repetitions per test (1-25, no automatic test retries)
        type: string
        default: '1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Chromium, Firefox and WebKit / packed consumers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exercise packed browser consumers
        env:
          BROWSER_PROJECT: ${{ inputs.project || 'all' }}
          BROWSER_REPEAT: ${{ inputs.repeat || '1' }}
        run: |
          if [ "$BROWSER_PROJECT" = all ]; then
            node scripts/test-browser.mjs --install --repeat "$BROWSER_REPEAT"
          else
            node scripts/test-browser.mjs --install --project "$BROWSER_PROJECT" --repeat "$BROWSER_REPEAT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: browser-acceptance
          path: test-results/browser/
          retention-days: 7
          if-no-files-found: warn
