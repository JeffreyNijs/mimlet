name: Portable runtime acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-versions:
    name: Native version range / ${{ matrix.adapter }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        adapter: [zod, typebox, typebox-legacy, arktype, faker, effect, valibot, fast-check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/test-vendor-versions.mjs ${{ matrix.adapter }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-version-report-${{ matrix.adapter }}
          path: test-results/vendor-versions-${{ matrix.adapter }}.json
          if-no-files-found: error
          retention-days: 7

  portable:
    name: Packed core / ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun, deno]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.18.0
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: matrix.runtime == 'bun'
        with:
          bun-version: 1.4.2
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        if: matrix.runtime == 'deno'
        with:
          deno-version: 2.9.7
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:core
      - run: node scripts/test-runtimes.mjs ${{ matrix.runtime }}

  minimum-compiler:
    name: TypeScript 5.8.3 / core and portable consumers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the exact minimum compiler outside the workspace
        run: npm install --prefix "$RUNNER_TEMP/minimum-ts" --ignore-scripts --no-audit --no-fund typescript@5.8.3
      - name: Compile the core and all its negative declaration tests
        run: |
          node "$RUNNER_TEMP/minimum-ts/node_modules/typescript/bin/tsc" -p packages/core/tsconfig.json --extendedDiagnostics
          node "$RUNNER_TEMP/minimum-ts/node_modules/typescript/bin/tsc" -p packages/core/test/tsconfig.json
          node scripts/test-core.mjs
      - name: Exercise packed consumers with the same minimum compiler
        run: |
          export TOOLKIT_TYPESCRIPT_COMPILER="$RUNNER_TEMP/minimum-ts/node_modules/typescript/bin/tsc"
          node scripts/test-optional.mjs adapter
          node scripts/test-optional.mjs consumers
          node scripts/test-optional.mjs faker

  newest-compiler:
    name: TypeScript 7.0.2 / packed consumers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The packages are built with the workspace's TypeScript 6 toolchain, as published.
      # TypeScript 7 only type-checks the consumer code against the packed declarations.
      - run: pnpm build
      - name: Install the exact TypeScript 7 compiler outside the workspace
        run: npm install --prefix "$RUNNER_TEMP/typescript-7" --ignore-scripts --no-audit --no-fund typescript@7.0.2
      - name: Type-check every packed package and the recipes as a TypeScript 7 consumer
        run: |
          export TOOLKIT_CONSUMER_TYPESCRIPT_COMPILER="$RUNNER_TEMP/typescript-7/node_modules/typescript/bin/tsc"
          node scripts/test-optional-all.mjs
          node scripts/test-typebox.mjs
          node scripts/test-examples.mjs
      # Hey API loads the TypeScript compiler API, which TypeScript 7 does not ship. This step
      # installs TypeScript 6 as `typescript` (@typescript/typescript6) beside TypeScript 7 as
      # `@typescript/native`, generates a client and compiles it with TypeScript 7's tsc.
      - name: Generate Hey API builders with TypeScript 6 beside TypeScript 7
        run: node scripts/validate-package.mjs --typescript-7

  performance-and-recipes:
    name: Executable recipes and performance report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/test-examples.mjs
      - run: node scripts/benchmark.ts
      - run: node scripts/benchmark-types.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: performance-report
          path: |
            test-results/performance.json
            test-results/typescript-performance.json
          if-no-files-found: error
          retention-days: 7
